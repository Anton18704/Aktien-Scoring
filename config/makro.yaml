# =====================================================================
#  Makro-Sektorfaktoren und Zyklusuhr
# =====================================================================
#
#  Jeder Sektor startet mit dem Faktor 1,0. Der Gesamtscore jeder Aktie
#  wird mit dem Faktor ihres Sektors multipliziert (begrenzt, siehe unten).
#  Der Score ohne Makro wird immer daneben angezeigt.
#
#  Die Logik ist ANTIZYKLISCH:
#   - Niveau:   Liegen die Sektor-Indikatoren über (+) oder unter (–) ihrem
#               10-Jahres-Durchschnitt? (gemessen in Standardabweichungen)
#   - Richtung: Verbessern (+) oder verschlechtern (–) sie sich gerade?
#               (Veränderung der letzten 6 Monate)
#  Daraus ergibt sich die Phase auf der Zyklusuhr und der Grundfaktor:
#     Erholung   (Niveau schlecht, Richtung besser)    → bester Einstieg
#     Abschwung  (Niveau schlecht, Richtung schlechter) → beobachten
#     Aufschwung (Niveau gut, Richtung besser)          → läuft schon
#     Boom/Wende (Niveau gut, Richtung schlechter)      → schlechtester Zeitpunkt
#  Dazu ein Bonus/Malus für die Bewertung des Sektors (KGV und Kurs-Trend).
#
#  Alle Werte darfst du ändern. Wirkung: nach "Makrodaten aktualisieren"
#  auf der Seite "Sektoren".
# =====================================================================

aktiv: false            # true = Gesamtscore × Sektorfaktor; false = Faktoren werden nur angezeigt
                        # Ausgeschaltet, weil der Prüfstand (Seite "Sektoren & Zyklus") bisher keine
                        # Vorhersagekraft zeigt. Erst wieder einschalten, wenn die Regeln den Test bestehen.

faktor_min: 0.7
faktor_max: 1.3

phasen:
  erholung:   {name: Erholung,   faktor: 1.25, farbe: "#27ae60"}
  abschwung:  {name: Abschwung,  faktor: 1.05, farbe: "#f1c40f"}
  aufschwung: {name: Aufschwung, faktor: 0.90, farbe: "#e67e22"}
  boom:       {name: Boom/Wende, faktor: 0.75, farbe: "#c0392b"}
  neutral:    {name: Neutral,    faktor: 1.00, farbe: "#95a5a6"}

# Liegen Niveau UND Richtung näher als dieser Wert an 0, gilt die Phase "Neutral".
neutral_zone: 0.25

# Bewertungs-Bonus: günstiger Sektor → bis zu +max_bonus, teurer Sektor → bis zu –max_bonus
bewertung:
  max_bonus: 0.10
  etf_spanne: 30          # Abweichung des ETF-Kurses vom 10-Jahres-Trend (%), die als "voll teuer/günstig" gilt

historie_jahre: 10        # Vergleichszeitraum für "Niveau" (einzelne Indikatoren können abweichen, siehe unten)
max_alter_monate: 6       # ältere Indikatoren (z. B. eingestellte Reihen) werden nicht verwendet
richtung_monate: 6        # Zeitraum für "Richtung"
glaettung_monate: 3       # Niveau und Richtung aus dem gleitenden Durchschnitt (1 = ungeglättet)
bestaetigung_monate: 2    # neue Phase gilt erst, wenn sie so viele Monate in Folge angezeigt wird (1 = sofort)

# ---------------------------------------------------------------------
#  Indikatoren (alle kostenlos von FRED, Federal Reserve Bank of St. Louis)
#  umrechnung: "niveau" = Wert direkt, "jahresrate" = Veränderung zum Vorjahr in %
# ---------------------------------------------------------------------
indikatoren:
  konjunktur:     {fred: CFNAIMA3,         name: Chicago-Fed-Aktivitätsindex (3-Monats-Ø), umrechnung: niveau}
  zinskurve:      {fred: T10Y2Y,           name: Zinskurve 10 J. – 2 J., umrechnung: niveau}
  # Kreditaufschlag: Moody's-Baa-Unternehmensanleihen minus 10-jährige Staatsanleihe (Daten seit 1986).
  # (Der Hochzinsanleihen-Spread BAMLH0A0HYM2 liefert bei FRED nur noch 3 Jahre und wird nicht mehr verwendet.)
  kreditspread:   {fred: BAA10Y,           name: Kreditaufschlag Unternehmensanleihen (Baa), umrechnung: niveau}
  # Zinsen werden mit 30 Jahren verglichen: die letzten 10 Jahre enthalten die Nullzinsphase und lassen
  # heutige Zinsen sonst extremer wirken, als sie langfristig sind. (Realzins gibt es erst seit 2003.)
  realzins:       {fred: DFII10,           name: Realzins 10 J., umrechnung: niveau, historie_jahre: 30}
  zins10:         {fred: DGS10,            name: Rendite 10-jährige US-Anleihe, umrechnung: niveau, historie_jahre: 30}
  oel:            {fred: DCOILWTICO,       name: Ölpreis WTI, umrechnung: jahresrate}
  gas:            {fred: DHHNGSP,          name: Erdgaspreis Henry Hub, umrechnung: jahresrate}
  kupfer:         {fred: PCOPPUSDM,        name: Kupferpreis, umrechnung: jahresrate}
  kapazitaet:     {fred: TCU,              name: Kapazitätsauslastung, umrechnung: niveau}
  indprod:        {fred: INDPRO,           name: Industrieproduktion, umrechnung: jahresrate}
  auftraege:      {fred: DGORDER,          name: Auftragseingang langlebige Güter, umrechnung: jahresrate}
  it_auftraege:   {fred: A34SNO,           name: Auftragseingang Computer & Elektronik, umrechnung: jahresrate}
  konsumklima:    {fred: UMCSENT,          name: Konsumklima (Univ. Michigan), umrechnung: niveau}
  einzelhandel:   {fred: RSAFS,            name: Einzelhandelsumsatz, umrechnung: jahresrate}
  erstantraege:   {fred: ICSA,             name: Erstanträge Arbeitslosenhilfe, umrechnung: niveau}
  cpi:            {fred: CPIAUCSL,         name: Verbraucherpreise, umrechnung: jahresrate}
  ppi:            {fred: PPIACO,           name: Erzeugerpreise, umrechnung: jahresrate}
  med_preise:     {fred: CPIMEDSL,         name: Preise medizinische Versorgung, umrechnung: jahresrate}
  kreditstandards: {fred: DRTSCILM,        name: Verschärfung Kreditstandards der Banken, umrechnung: niveau}
  # Housing
  baugenehmigungen: {fred: PERMIT,         name: Baugenehmigungen, umrechnung: jahresrate}
  baubeginne:     {fred: HOUST,            name: Baubeginne, umrechnung: jahresrate}
  hypozins:       {fred: MORTGAGE30US,     name: Hypothekenzins 30 J., umrechnung: niveau, historie_jahre: 30}
  hauspreise:     {fred: CSUSHPINSA,       name: Hauspreise (Case-Shiller), umrechnung: jahresrate}
  hausangebot:    {fred: MSACSR,           name: Angebot neuer Häuser (Monate), umrechnung: niveau}
  # Abgeleitet: Verbraucherpreise minus Erzeugerpreise (Preissetzungsmacht / Margen)
  # Preisspanne der Lebensmittelhersteller: Verbraucherpreise Lebensmittel minus Erzeugerpreise verarbeitete
  # Lebensmittel (statt aller Erzeugerpreise, die stark vom Ölpreis getrieben sind)
  cpi_lebensmittel: {fred: CPIUFDSL,       name: Verbraucherpreise Lebensmittel, umrechnung: jahresrate}
  ppi_lebensmittel: {fred: WPU02,          name: Erzeugerpreise verarbeitete Lebensmittel, umrechnung: jahresrate}
  margenspanne:   {differenz: [cpi_lebensmittel, ppi_lebensmittel], name: Lebensmittel-Preisspanne (Verbraucher- minus Erzeugerpreise)}

# ---------------------------------------------------------------------
#  Sektoren: welche Indikatoren zählen, und wann sind sie "gut"?
#  gut_wenn: hoch / niedrig     gewicht: Bedeutung (Standard 1)
#  etf: Sektor-ETF für den Kurs-Trend (Yahoo Finance)
# ---------------------------------------------------------------------
sektoren:
  IT:
    etf: XLK
    indikatoren:
      - {id: it_auftraege, gut_wenn: hoch, gewicht: 2}
      - {id: realzins,     gut_wenn: niedrig}
      - {id: konjunktur,     gut_wenn: hoch}
      - {id: kreditspread,    gut_wenn: niedrig, gewicht: 0.5}
  Kommunikation:
    etf: XLC
    indikatoren:
      - {id: konsumklima,  gut_wenn: hoch}
      - {id: einzelhandel, gut_wenn: hoch}
      - {id: realzins,     gut_wenn: niedrig}
      - {id: kreditspread,    gut_wenn: niedrig, gewicht: 0.5}
  Zyklischer Konsum:
    etf: XLY
    indikatoren:
      - {id: konsumklima,      gut_wenn: hoch}
      - {id: einzelhandel,     gut_wenn: hoch}
      - {id: erstantraege,     gut_wenn: niedrig}
      - {id: baugenehmigungen, gut_wenn: hoch}
      - {id: hypozins,         gut_wenn: niedrig}
  Basiskonsum:
    etf: XLP
    indikatoren:
      - {id: margenspanne, gut_wenn: hoch, gewicht: 2}
      - {id: zins10,       gut_wenn: niedrig}
  Gesundheit:
    etf: XLV
    indikatoren:
      - {id: med_preise,   gut_wenn: hoch, gewicht: 2}
      - {id: realzins,     gut_wenn: niedrig}
  Finanzwerte:
    etf: XLF
    indikatoren:
      - {id: zinskurve,        gut_wenn: hoch, gewicht: 2}
      - {id: kreditspread,        gut_wenn: niedrig}
      - {id: kreditstandards,  gut_wenn: niedrig}
      - {id: baugenehmigungen, gut_wenn: hoch, gewicht: 0.5}
  Industrie:
    etf: XLI
    indikatoren:
      - {id: auftraege,    gut_wenn: hoch, gewicht: 2}
      - {id: indprod,      gut_wenn: hoch}
      - {id: kapazitaet,   gut_wenn: hoch}
      - {id: konjunktur,     gut_wenn: hoch}
      - {id: baubeginne,   gut_wenn: hoch, gewicht: 0.5}
  Grundstoffe:
    etf: XLB
    indikatoren:
      - {id: kupfer,       gut_wenn: hoch, gewicht: 2}
      - {id: kapazitaet,   gut_wenn: hoch}
      - {id: baubeginne,   gut_wenn: hoch}
      - {id: konjunktur,     gut_wenn: hoch}
  Energie:
    etf: XLE
    indikatoren:
      - {id: oel,          gut_wenn: hoch, gewicht: 2}
      - {id: gas,          gut_wenn: hoch}
      - {id: konjunktur,     gut_wenn: hoch}
  Versorger:
    etf: XLU
    indikatoren:
      - {id: zins10,       gut_wenn: niedrig, gewicht: 2}
      - {id: realzins,     gut_wenn: niedrig}
  Immobilien:
    etf: XLRE
    indikatoren:
      - {id: hypozins,         gut_wenn: niedrig, gewicht: 2}
      - {id: zins10,           gut_wenn: niedrig}
      - {id: baugenehmigungen, gut_wenn: hoch}
      - {id: hauspreise,       gut_wenn: hoch}
      - {id: hausangebot,      gut_wenn: niedrig}
