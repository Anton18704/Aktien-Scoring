# =====================================================================
#  Zuordnung SIC-Code (aus SEC EDGAR) -> Sektor
# =====================================================================
#
#  Die Regeln werden von oben nach unten geprüft. Die erste passende
#  Regel gewinnt. Deshalb stehen die speziellen Bereiche oben und die
#  allgemeinen weiter unten.
#
#  von / bis: SIC-Bereich (beide Grenzen gehören dazu)
#  sektor:    einer der 11 Sektoren unten
#
#  Der Sektor dient nur zur Markierung und Filterung. Er verändert
#  keine Scores. In der App kannst du ihn pro Titel von Hand ändern.
# =====================================================================

